apiVersion: fintlabs.no/v1alpha1
kind: Application
metadata:
  name: fint-core-gateway-timeout
  namespace: fint-core
  labels:
    app.kubernetes.io/name: fint-core-gateway-timeout
    app.kubernetes.io/instance: fint-core-gateway-timeout_fintlabs_no
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fint-core
    fintlabs.no/team: core
    fintlabs.no/org-id: fintlabs.no
spec:
  orgId: fintlabs.no
  replicas: 1
  port: 8080
  image: ghcr.io/fintlabs/fint-core-gateway-timeout:latest
  env:
    - name: BASE_PATH
      value: /core/gateway-timeout
    - name: MAX_HOLD
      value: 10m
  ingress:
    routes:
      - host: REPLACE
        path: /core/gateway-timeout
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
  probes:
    startup:
      path: /core/gateway-timeout/healthz
      port: 8080
      failureThreshold: 30
      periodSeconds: 2
      timeoutSeconds: 2
    liveness:
      path: /core/gateway-timeout/healthz
      port: 8080
      periodSeconds: 30
      timeoutSeconds: 2
    readiness:
      path: /core/gateway-timeout/healthz
      port: 8080
      periodSeconds: 10
      timeoutSeconds: 2
